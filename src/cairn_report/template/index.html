<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Research report</title>
  <link rel="stylesheet" href="report.css">
  <link rel="stylesheet" href="report-extra.css">
</head>
<body>
  <aside class="rail">
    <a class="brand" href="#top"><span>R</span> Research report</a>
    <div class="rail-actions"><button id="copy-comments" class="rail-icon" type="button" aria-label="Copy comments for the agent" data-tooltip="Copy comments for the agent"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/></svg></button><button id="clear-comments" class="rail-icon" type="button" aria-label="Clear all comments" data-tooltip="Clear all comments"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7h15M9.5 7V5h5v2M6.5 7l1 12.5h9l1-12.5M10 10.5v5.5M14 10.5v5.5"/></svg></button></div>
    <div id="clear-confirm" class="confirm-popover" role="alertdialog" aria-labelledby="clear-confirm-text" hidden><p id="clear-confirm-text"></p><div class="confirm-actions"><button type="button" data-confirm="cancel">Cancel</button><button type="button" class="danger" data-confirm="clear">Clear</button></div></div>
    <section id="report-list-section" class="report-list" hidden><p class="rail-label">Reports</p><nav id="report-list" aria-label="Reports"></nav></section>
    <p class="rail-label rail-sections-label">On this page</p><nav id="report-nav" aria-label="Sections"></nav>
    <div class="rail-note">Hydra-backed evidence<br><kbd>←</kbd> <kbd>→</kbd> browse figures</div>
  </aside>
  <main id="top">
    <header class="hero" data-comment-target="section:overview"><div><a id="overview-link" class="overview-link" hidden></a><p class="eyebrow">Running research record</p><h1 id="title"></h1><p id="subtitle" class="subtitle"></p><p id="report-summary" class="report-summary" hidden></p></div><div class="status" id="status"></div></header>
    <article id="report-prose" class="report-prose"></article>
    <section id="unanchored-comments" class="unanchored-comments" hidden><h2>Comments on removed content</h2><p>These comments point to text or figures that no longer exist in this report. Open one to edit, delete, or move its content.</p><ul id="unanchored-list"></ul></section>
    <footer data-comment-target="section:footer"><span id="updated"></span><a href="manifest.json">Build manifest</a></footer>
  </main>

  <dialog id="lightbox" class="lightbox"><button class="icon close" aria-label="Close">×</button><button class="icon previous" aria-label="Previous figure">←</button><div class="stage"><img id="lightbox-image" alt="" draggable="false"><div id="lightbox-plot" hidden></div><div class="lightbox-copy"><div class="lightbox-heading"><h3 id="lightbox-title"></h3><button id="lightbox-info" class="info-toggle" type="button" aria-label="Show figure source" title="Show figure source (i)" aria-expanded="false" aria-controls="lightbox-trace">i</button></div><p id="lightbox-caption"></p><dl id="lightbox-trace" class="lightbox-trace"></dl></div></div><button class="icon next" aria-label="Next figure">→</button><button id="lightbox-comment" class="image-comment" aria-label="Comment on figure" title="Comment on figure"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-8l-5 3v-3H5a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2Z"/></svg></button><div class="zoom"><button data-zoom="out">−</button><span id="zoom-label">100%</span><button data-zoom="in">+</button><button data-zoom="reset">Reset</button></div></dialog>
  <button id="selection-comment" hidden aria-label="Comment on selection" title="Comment on selection"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-8l-5 3v-3H5a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2Z"/></svg></button>
  <div id="comment-popover" class="comment-popover" hidden><form id="comment-form"><button id="comment-delete" class="popover-delete" type="button" aria-label="Delete comment" title="Delete comment"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7h15M9.5 7V5h5v2M6.5 7l1 12.5h9l1-12.5M10 10.5v5.5M14 10.5v5.5"/></svg></button><p id="comment-target"></p><blockquote id="comment-quote" hidden></blockquote><input type="hidden" name="id"><input type="hidden" name="target"><input type="hidden" name="line"><input type="hidden" name="quote"><textarea name="text" maxlength="4000" placeholder="Write a comment…" aria-label="Comment"></textarea><p id="comment-message" role="status"></p></form></div>
  <script src="plotly.min.js"></script>
  <script src="report.js"></script>
</body>
</html>
