<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Report</title>
  <link rel="stylesheet" href="report.css">
  <link rel="stylesheet" href="report-extra.css">
</head>
<body>
  <aside class="rail">
    <a class="brand" href="#top"><span>R</span> <span id="site-title" class="site-title">Reports</span></a>
    <div class="rail-actions"><button id="copy-comments" class="rail-icon" type="button" aria-label="Copy comments" data-tooltip="Copy comments"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/></svg></button><button id="clear-comments" class="rail-icon" type="button" aria-label="Clear all comments" data-tooltip="Clear all comments"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7h15M9.5 7V5h5v2M6.5 7l1 12.5h9l1-12.5M10 10.5v5.5M14 10.5v5.5"/></svg></button></div>
    <div id="clear-confirm" class="confirm-popover" role="alertdialog" aria-labelledby="clear-confirm-text" hidden><p id="clear-confirm-text"></p><div class="confirm-actions"><button type="button" data-confirm="cancel">Cancel</button><button type="button" class="danger" data-confirm="clear">Clear</button></div></div>
    <section id="report-list-section" class="report-list" hidden><p class="rail-label">Reports</p><nav id="report-list" aria-label="Reports"></nav></section>
    <div class="rail-note"><kbd>←</kbd> <kbd>→</kbd> browse figures<br><kbd>,</kbd> <kbd>.</kbd> step video frames</div>
  </aside>
  <main id="top">
    <header class="hero" data-comment-target="section:overview"><div><p id="eyebrow" class="eyebrow" hidden></p><h1 id="title"></h1><p id="subtitle" class="subtitle"></p><p id="report-summary" class="report-summary" hidden></p></div><div class="status" id="status"></div></header>
    <section id="data-panel" class="data-panel" aria-label="Data" hidden><h2>Data</h2><ul id="data-list"></ul></section>
    <article id="report-prose" class="report-prose"></article>
    <section id="unanchored-comments" class="unanchored-comments" hidden><h2>Comments on removed content</h2><p>These comments point to text or figures that no longer exist in this report. Open one to edit, delete, or move its content.</p><ul id="unanchored-list"></ul></section>
    <footer data-comment-target="section:footer"><span id="updated"></span><a href="manifest.json">Build manifest</a></footer>
  </main>

  <dialog id="lightbox" class="lightbox"><button class="icon close" aria-label="Close">×</button><button class="icon previous" aria-label="Previous figure">←</button><div class="stage"><img id="lightbox-image" alt="" draggable="false"><video id="lightbox-video" hidden muted loop playsinline disablepictureinpicture></video><div id="video-controls" class="video-controls" hidden><button id="video-play" type="button" aria-label="Play">▶</button><button id="video-back" type="button" aria-label="Previous frame" title="Previous frame (,)">‹</button><button id="video-forward" type="button" aria-label="Next frame" title="Next frame (.)">›</button><input id="video-scrub" type="range" min="0" max="1" step="any" value="0" aria-label="Position"><span id="video-time" class="video-time"></span><select id="video-speed" aria-label="Playback speed" title="Playback speed"><option value="0.1">0.1×</option><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></div><div id="lightbox-plot" hidden></div><div class="lightbox-copy"><div class="lightbox-heading"><h3 id="lightbox-title"></h3><button id="lightbox-info" class="info-toggle" type="button" aria-label="Show figure source" title="Show figure source (i)" aria-expanded="false" aria-controls="lightbox-trace">i</button></div><p id="lightbox-caption"></p><dl id="lightbox-trace" class="lightbox-trace"></dl></div></div><button class="icon next" aria-label="Next figure">→</button><button id="lightbox-copy" class="image-copy" type="button" aria-label="Copy location" title="Copy location" data-tooltip="Copy location"></button><button id="lightbox-comment" class="image-comment" aria-label="Comment on figure" title="Comment on figure"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-8l-5 3v-3H5a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2Z"/></svg></button><div class="zoom"><button data-zoom="out">−</button><span id="zoom-label">100%</span><button data-zoom="in">+</button><button data-zoom="reset">Reset</button></div></dialog>
  <button id="selection-copy" class="image-copy" type="button" hidden aria-label="Copy location" title="Copy location" data-tooltip="Copy location"></button>
  <button id="selection-comment" hidden aria-label="Comment on selection" title="Comment on selection"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-8l-5 3v-3H5a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2Z"/></svg></button>
  <div id="comment-popover" class="comment-popover" hidden><form id="comment-form"><button id="comment-delete" class="popover-delete" type="button" aria-label="Delete comment" title="Delete comment"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7h15M9.5 7V5h5v2M6.5 7l1 12.5h9l1-12.5M10 10.5v5.5M14 10.5v5.5"/></svg></button><p id="comment-target"></p><blockquote id="comment-quote" hidden></blockquote><input type="hidden" name="id"><input type="hidden" name="target"><input type="hidden" name="line"><input type="hidden" name="quote"><textarea name="text" maxlength="4000" placeholder="Write a comment…" aria-label="Comment"></textarea><p id="comment-message" role="status"></p></form></div>
  <script src="plotly.min.js"></script>
  <script src="report.js"></script>
</body>
</html>
