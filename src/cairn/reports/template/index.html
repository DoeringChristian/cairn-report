<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Report</title>
  <link rel="stylesheet" href="report.css">
  <link rel="stylesheet" href="report-extra.css">
</head>
<body>
  <aside class="rail">
    <a class="brand" href="#top"><span>R</span> <span id="site-title" class="site-title">Reports</span></a>
    <section id="report-list-section" class="report-list" hidden><p class="rail-label">Reports</p><nav id="report-list" aria-label="Reports"></nav></section>
    <div class="rail-note"><kbd>←</kbd> <kbd>→</kbd> browse figures<br><kbd>,</kbd> <kbd>.</kbd> step video frames</div>
  </aside>
  <main id="top">
    <header class="hero"><div><p id="eyebrow" class="eyebrow" hidden></p><h1 id="title"></h1><p id="subtitle" class="subtitle"></p><p id="report-summary" class="report-summary" hidden></p></div><div class="status" id="status"></div></header>
    <section id="data-panel" class="data-panel" aria-label="Data" hidden><h2>Data</h2><ul id="data-list"></ul></section>
    <article id="report-prose" class="report-prose"></article>
    <footer><span id="updated"></span><a href="manifest.json">Build manifest</a></footer>
  </main>

  <dialog id="lightbox" class="lightbox"><button class="icon close" aria-label="Close">×</button><button class="icon previous" aria-label="Previous figure">←</button><div class="stage"><img id="lightbox-image" alt="" draggable="false"><video id="lightbox-video" hidden muted loop playsinline disablepictureinpicture></video><div id="video-controls" class="video-controls" hidden><button id="video-play" type="button" aria-label="Play">▶</button><button id="video-back" type="button" aria-label="Previous frame" title="Previous frame (,)">‹</button><button id="video-forward" type="button" aria-label="Next frame" title="Next frame (.)">›</button><input id="video-scrub" type="range" min="0" max="1" step="any" value="0" aria-label="Position"><span id="video-time" class="video-time"></span><select id="video-speed" aria-label="Playback speed" title="Playback speed"><option value="0.1">0.1×</option><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></div><div id="lightbox-plot" hidden></div><div class="lightbox-copy"><div class="lightbox-heading"><h3 id="lightbox-title"></h3><button id="lightbox-info" class="info-toggle" type="button" aria-label="Show figure source" title="Show figure source (i)" aria-expanded="false" aria-controls="lightbox-trace">i</button></div><p id="lightbox-caption"></p><dl id="lightbox-trace" class="lightbox-trace"></dl></div></div><button class="icon next" aria-label="Next figure">→</button><button id="lightbox-copy" class="image-copy" type="button" aria-label="Copy location" title="Copy location" data-tooltip="Copy location"></button><div class="zoom"><button data-zoom="out">−</button><span id="zoom-label">100%</span><button data-zoom="in">+</button><button data-zoom="reset">Reset</button></div></dialog>
  <button id="selection-copy" class="image-copy" type="button" hidden aria-label="Copy location" title="Copy location" data-tooltip="Copy location"></button>
  <script src="plotly.min.js"></script>
  <script src="report.js"></script>
</body>
</html>
