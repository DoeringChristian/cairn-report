[project]
name = "cairn-report"
version = "0.11.0"
description = "Static reports from Markdown and run outputs, a run logger, and an artifact hub for reports and runs."
readme = "README.md"
authors = [
    { name = "Christian Döring", email = "christian.doering@tum.de" }
]
requires-python = ">=3.11"
dependencies = [
    "latex2mathml>=3.77",
    "markdown-it-py>=3.0",
    "matplotlib>=3.8",
    "mdit-py-plugins>=0.4",
    "plotly>=5.20",
    "pyyaml>=6.0",
]

[project.scripts]
cairn-report = "cairn_report.cli:main"

[project.urls]
Repository = "https://github.com/DoeringChristian/cairn-report"

[project.optional-dependencies]
hydra = [
    "hydra-core>=1.3",
]
video = [
    "imageio>=2.31",
    "imageio-ffmpeg>=0.5",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hydra-core>=1.3.7",
    "imageio>=2.38.1",
    "imageio-ffmpeg>=0.6.0",
    "pytest>=8",
]
