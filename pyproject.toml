[project]
name = "cairn"
version = "0.14.0"
description = "Cairn: an artifact store for research, with a server and a UI: runs and their results as versioned artifacts, and reports built from pinned artifacts."
readme = "README.md"
authors = [
    { name = "Christian Döring", email = "christian.doering@tum.de" }
]
requires-python = ">=3.11"
dependencies = [
    "latex2mathml>=3.77",
    "markdown-it-py>=3.0",
    "matplotlib>=3.8",
    "mdit-py-plugins>=0.4",
    "plotly>=5.20",
    "pyyaml>=6.0",
]

[project.scripts]
cairn = "cairn.cli:main"

[project.urls]
Repository = "https://github.com/DoeringChristian/cairn"

[project.optional-dependencies]
# Placeholders for the parts that need nothing extra yet: the server and the UI use only the standard
# library, and the UI's built files ship with the package.
server = [
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
]
ui = []
hydra = [
    "hydra-core>=1.3",
]
video = [
    "imageio>=2.31",
    "imageio-ffmpeg>=0.5",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "hydra-core>=1.3.7",
    "imageio>=2.38.1",
    "imageio-ffmpeg>=0.6.0",
    "pytest>=8",
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
]

[tool.pytest.ini_options]
# Any warning is an error, so a warning from Cairn's own code (a deprecation, a resource leak) fails the suite.
filterwarnings = ["error"]

[tool.black]
line-length = 120
target-version = ["py311"]
